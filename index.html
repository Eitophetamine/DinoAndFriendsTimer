<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dino Pals Timer &amp; Stopwatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="toggles"><button id="muteBtn" aria-pressed="false" aria-label="Mute sounds" title="Sound">🔔</button><button id="nightBtn" aria-pressed="false" aria-label="Switch to night" title="Day / night">🌙</button></div>
<div class="scene" aria-hidden="true">
  <div class="sun"></div><div class="stars"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="hill h1"></div><div class="hill h2"></div>
  <div class="flowers" id="flowers"></div>
  <div class="cast" id="cast"></div>
</div>

<main class="card">
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-timer" aria-selected="true" data-tab="timer">Timer</button>
    <button role="tab" id="tab-stopwatch" aria-selected="false" data-tab="stopwatch">Stopwatch</button>
    <button role="tab" id="tab-pomodoro" aria-selected="false" data-tab="pomodoro">Pomodoro</button>
    <span class="tab-pill"></span>
  </div>

  <section id="timer" class="panel" role="tabpanel">
    <div class="ring-wrap">
      <svg class="ring" viewBox="0 0 220 220">
        <circle class="ring-bg" cx="110" cy="110" r="98"/>
        <circle class="ring-fg" id="ring" cx="110" cy="110" r="98"/>
      </svg>
      <div class="ring-center">
        <div class="readout" id="timerReadout">00:05:00</div>
        <div class="status" id="timerStatus">Ready when you are</div>
      </div>
    </div>
    <div class="inputs" id="timerInputs">
      <label>Hours<input type="number" id="inH" min="0" max="99" value="0"></label>
      <label>Minutes<input type="number" id="inM" min="0" max="59" value="5"></label>
      <label>Seconds<input type="number" id="inS" min="0" max="59" value="0"></label>
    </div>
    <div class="presets">
      <button data-s="60">1 min</button><button data-s="300">5 min</button>
      <button data-s="600">10 min</button><button data-s="1500">25 min</button>
    </div>
    <div class="controls">
      <button class="btn ghost" id="timerReset">Reset</button>
      <button class="btn primary" id="timerStart">Start</button>
    </div>
  </section>

  <section id="stopwatch" class="panel" role="tabpanel" hidden>
    <div class="sw-face">
      <div class="readout big" id="swReadout">00:00.00</div>
      <div class="status" id="swStatus">Tap start to begin</div>
    </div>
    <div class="controls">
      <button class="btn ghost" id="swReset">Reset</button>
      <button class="btn primary" id="swStart">Start</button>
      <button class="btn accent" id="swLap" disabled>Lap</button>
    </div>
    <ol class="laps" id="laps"></ol>
  </section>
  <section id="pomodoro" class="panel" role="tabpanel" hidden>
    <div class="sw-face">
      <div class="status" id="pmMode" style="font-weight:600;font-size:1.1rem">Focus time</div>
      <div class="readout big" id="pmReadout">25:00</div>
      <div class="bar"><div id="pmBar"></div></div>
      <div class="dots" id="pmDots" aria-label="Focus sessions done"><i></i><i></i><i></i><i></i></div>
      <div class="status" id="pmStatus">4 focus rounds earn a long break</div>
    </div>
    <div class="presets">
      <label class="len">Focus <input type="number" id="pmF" min="1" max="90" value="25"></label>
      <label class="len">Break <input type="number" id="pmB" min="1" max="30" value="5"></label>
      <label class="len">Long <input type="number" id="pmL" min="1" max="60" value="15"></label>
    </div>
    <div class="controls">
      <button class="btn ghost" id="pmReset">Reset</button>
      <button class="btn primary" id="pmStart">Start</button>
      <button class="btn accent" id="pmSkip">Skip</button>
    </div>
  </section>
  <p class="hint">Space starts and pauses. Press L for a lap. Pomodoro length is in minutes.</p>
</main>
<script src="js/app.js"></script>
</body>
</html>
